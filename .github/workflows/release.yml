name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Bump patch version
        id: version
        shell: pwsh
        run: |
          $version = ./scripts/bump-version.ps1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore CoreDesk.sln

      - name: Test
        run: dotnet test tests\CoreDesk.Tests\CoreDesk.Tests.csproj -c Release --no-restore

      - name: Build installer and update manifest
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Generate release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip release]"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CoreDesk ${{ steps.version.outputs.version }}
          body_path: artifacts/release-notes.md
          prerelease: false
          make_latest: true
          files: |
            artifacts/setup/CoreDesk-Setup-${{ steps.version.outputs.version }}-x64.exe
            artifacts/setup/CoreDesk-Setup-${{ steps.version.outputs.version }}-arm64.exe
            artifacts/setup/coredesk-update.json
